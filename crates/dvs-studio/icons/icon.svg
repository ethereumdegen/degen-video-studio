<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="degen video studio">
  <title>degen video studio</title>
  <rect width="1024" height="1024" rx="208" fill="#11131a"/>
  <rect x="96" y="96" width="832" height="832" rx="148" fill="none" stroke="#1d2230" stroke-width="16"/>

  <!-- Three timeline tracks: the document, which is the thing this tool is about. -->
  <rect x="176" y="286" width="420" height="78" rx="22" fill="#2f6fc4"/>
  <rect x="616" y="286" width="232" height="78" rx="22" fill="#2f6fc4" fill-opacity="0.55"/>
  <rect x="176" y="404" width="236" height="78" rx="22" fill="#b8792a"/>
  <rect x="176" y="522" width="672" height="78" rx="22" fill="#2f9a6b"/>

  <!-- Playhead. -->
  <rect x="470" y="248" width="10" height="392" rx="5" fill="#f4f6fb" fill-opacity="0.85"/>
  <circle cx="475" cy="248" r="26" fill="#f4f6fb"/>

  <!-- The agent's cursor on the timeline: a caret, not a mouse pointer. -->
  <path d="M700 694 l128 74 -128 74 z" fill="#f08a24"/>
  <rect x="176" y="700" width="464" height="62" rx="20" fill="#1d2230"/>
  <rect x="204" y="722" width="220" height="18" rx="9" fill="#5a6b86"/>
</svg>
